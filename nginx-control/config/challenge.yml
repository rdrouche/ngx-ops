# Challenge HTTP — réglages et conteneur géré depuis NGX Ops (v12.65.0).
# Éditable dans « Éditeur de configuration » ; après modification des clés
# challenge_*, utiliser « Régénérer et recharger nginx » (page Challenge HTTP).
# Priorité : variables NC_* (environnement) > ce fichier > défaut.
# Les clés challenge_* l'emportent sur celles de blocklists.yml (compatibilité v12.63/12.64).
#
# ── nginx ──────────────────────────────────────────────────────────────────
# challenge_enable: false            # écrire les directives dans nginx
# challenge_engine: builtin          # builtin (conteneur nginx-challenge) | anubis
# challenge_upstream: ""             # défaut : nginx-challenge:8080 / anubis:8923
# challenge_resolver: 127.0.0.11     # DNS Docker
# challenge_exempt_path_regex: '^/[.]well-known/'
# challenge_whitelist:               # v12.75.0 : IP / CIDR JAMAIS soumises au challenge (tous modes, tous vhosts)
#   - 203.0.113.10
#   - 198.51.100.0/24
#   - 2001:db8::/32
# challenge_fail_open: false          # true = si le conteneur du challenge est injoignable/en erreur, les requêtes PASSENT sans challenge
#                                    # (site disponible mais non protégé) ; false (défaut) = erreur 5xx tant qu'il est arrêté
# challenge_exempt_ua_regex: ""       # ex. '^NGXOps$' (User-Agent des requêtes sortantes de NGX Ops)
#
# ── profils par vhost ──────────────────────────────────────────────────────
# Un snippet dédié par vhost (snippets/challenge-<name>.conf), avec son mode et ses
# exemptions propres ; une exemption absente hérite du réglage global ci-dessus.
# name : minuscules, chiffres, _ (30 max) — mode : listed | all | allbots (défaut all)
# À inclure à la place des snippets globaux dans le server{} concerné.
# profiles:
#   - name: forgejo
#     mode: allbots
#     exempt_ua_regex: '^forgejo-runner/'
#   - name: wiki
#     mode: all
#     exempt_path_regex: '^/(api/|[.]well-known/)'
#
# ── conteneur géré par le dashboard ────────────────────────────────────────
# enable: false                     # démarrer/recréer le conteneur au boot
# container_image: ""               # défaut : CHALLENGE_DEFAULT_IMAGE / ANUBIS_DEFAULT_IMAGE
# secret: ""                        # défaut : généré et conservé (.generated-secrets.json)
# difficulty_bits: 16               # 8–64 (builtin) ; +1 bit = travail x2, ~28 = plusieurs minutes, >30 quasi impossible pour un navigateur
# cookie_hours: 24                  # 1–720 (builtin)
# language: auto                    # page de vérification : auto (navigateur, repli en) | fr | en
# goodbots: true                    # laisser passer les bons robots (vérif. DNS inverse)
# goodbots_extra: ""                # nom|regex-UA|.suffixe[,.suffixe][;nom2|…]
#
# ── analyse des IP en échec + blocage automatique (builtin, v12.73.0) ──────
# Le conteneur suit, par IP, les redirections vers la vérification, les solutions fausses et les
# limitations. Une IP qui n'a JAMAIS résolu le challenge et cumule `autoblock_threshold` échecs dans
# `autoblock_window_minutes` est bloquée `autoblock_hours` heures (403 immédiat). Pour que nginx la
# bloque aussi, ajouter dans blocklists.yml : sources: - name: challenge-bans / type: challenge /
# action: deny_403. Réglages pris en compte à la (re)création du conteneur. Tableau : page Challenge.
# autoblock: false                  # true pour activer le blocage (l'analyse reste active dans tous les cas)
# autoblock_threshold: 30           # 3–100000 échecs...
# autoblock_window_minutes: 60      # 1–1440 ... dans cette fenêtre
# autoblock_hours: 24               # 1–720 : durée du blocage
# offenders_hours: 24               # 1–168 : durée d'analyse conservée en mémoire
# anubis_difficulty: 4              # 1–8 (anubis)
# redirect_domains: ""              # anubis : domaines de redirection autorisés
# cookie_domain: ""                 # anubis : domaine du cookie
#
# Journal centralisé (log store, facultatif, moteur builtin) : adresse de l'API LOCALE du shipper. Le challenge y
# envoie ses DÉCISIONS (réussi, échoué, limité, blocage automatique, redirection au plus 1/min/IP) ; pas les requêtes
# laissées passer par cookie. Vide = aucun envoi. Jeton : SHIPPER_LOCAL_TOKEN (voir waf.yml). Pris en compte à la
# (re)création du conteneur. http:// uniquement vers un nom de service Docker, une boucle locale ou une IP privée.
# shipper_url: http://ngx-shipper:9181
