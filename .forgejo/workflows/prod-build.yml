name: Build images for NGX OPS

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag(s) Docker à build (séparés par une virgule, ex: 1.0.0,stable,latest)'
        required: true
        type: string
        default: '1.x.x'

# Évite deux builds simultanés sur la même ref
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_HOST: forge.rdr-it.com
  REGISTRY: forge.rdr-it.com/ngx-ops/ngx-ops
  IMAGE_AUTHOR: "Romain Drouche <contact@rdr-it.com>"

  # Spécifique au dashboard
  BRANDING_KOFI: https://ko-fi.com/rdrit0980
  BRANDING_SITE_LABEL: NGX OPS
  BRANDING_SITE: https://ngx-ops.net/
  BRANDING_REPO: https://forge.rdr-it.com/ngx-ops/ngx-ops/
  BRANDING_DOC: https://docs.ngx-ops.net/
  DASHBOARD_VERSION_URL: https://forge.rdr-it.com/ngx-ops/ngx-ops/raw/branch/main/meta/version-nginx-control
  NGINX_VERSION_URL: https://forge.rdr-it.com/ngx-ops/ngx-ops/raw/branch/main/meta/version-nginx
  SYNC_REF_URL: https://forge.rdr-it.com/ngx-ops/reference-files
  ALERTING_URL: https://forge.rdr-it.com/ngx-ops/ngx-ops/raw/branch/main/meta/alert-message
  CHANGELOG_URL: https://forge.rdr-it.com/ngx-ops/ngx-ops/raw/branch/main/meta/changelog
  INTEL_API_URL: https://intelligence.ngx-ops.net/api/v1/events

jobs:
  # ---------------------------------------------------------------
  # 1. Calcul des tags une seule fois, validés, partagés aux builds
  # ---------------------------------------------------------------
  prepare:
    runs-on: docker
    container:
      image: alpine:3.20
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      primary: ${{ steps.tags.outputs.primary }}
      created: ${{ steps.tags.outputs.created }}
    steps:
      - name: Interdire le build depuis main
        if: github.ref_name == 'main'
        run: |
          echo "::error::Le build est interdit depuis la branche main !"
          exit 1

      - name: Calculer et valider les tags
        id: tags
        env:
          # Passage par variable d'env : évite l'injection de code via l'input
          EVENT: ${{ github.event_name }}
          INPUT_TAGS: ${{ github.event.inputs.tag_name }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then RAW="$INPUT_TAGS"; else RAW="${REF#refs/tags/}"; fi

          TAGS=$(echo "$RAW" | tr ',' ' ' | xargs)
          [ -n "$TAGS" ] || { echo "::error::Aucun tag fourni"; exit 1; }

          for t in $TAGS; do
            echo "$t" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' \
              || { echo "::error::Tag Docker invalide : '$t'"; exit 1; }
          done

          PRIMARY="${TAGS%% *}"
          {
            echo "tags=$TAGS"
            echo "primary=$PRIMARY"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Tag principal : $PRIMARY / Tous : $TAGS"

  # ---------------------------------------------------------------
  # 2. Un seul bloc de build, décliné par image via une matrice
  # ---------------------------------------------------------------
  build:
    needs: prepare
    runs-on: docker
    container:
      image: docker:27-cli   # version épinglée plutôt que latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    strategy:
      fail-fast: false
      max-parallel: 2        # à ajuster selon la puissance du runner
      matrix:
        include:
          - image: ngx-ops-dashboard
            context: nginx-control
            title: ngx-ops-dashboard
            description: NGX Ops Dashboard
          - image: analyzer-agent
            context: nginx-analyzer-agent
            title: ngxops-analyzer-agent
            description: Analyzer Agent - NGX-OPS
          - image: analyzer-agent-go
            context: nginx-analyzer-agent-go
            title: nginx-analyzer-agent-go
            description: Analyzer Agent GO for NGX Ops
          - image: ngx-ops-challenge-http
            context: nginx-challenge
            title: ngx-ops-challenge-http
            description: Challenge HTTP GO for NGX Ops
          - image: ngx-ops-agent
            context: nginx-agent
            title: nginx-agent-for-ngx-ops
            description: Nginx Agent (Docker Auto + Proxy) For NGX OPS

    steps:
      - name: Installer Node.js (requis par actions/checkout)
        run: apk add --no-cache nodejs npm

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Minifier index.html
        if: matrix.image == 'ngx-ops-dashboard'
        run: |
          npx --yes html-minifier-terser@7 \
            --collapse-whitespace \
            --remove-comments \
            --remove-optional-tags \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --minify-css true \
            --minify-js true \
            -o nginx-control/public/index.html \
            nginx-control/public/index.html

      - name: Login au registre Forgejo
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$REPO_TOKEN" | docker login "$REGISTRY_HOST" -u "$ACTOR" --password-stdin

      - name: Build & push ${{ matrix.image }}
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          PRIMARY: ${{ needs.prepare.outputs.primary }}
          CREATED: ${{ needs.prepare.outputs.created }}
          IMAGE_NAME: ${{ matrix.image }}
          CTX: ${{ matrix.context }}
          TITLE: ${{ matrix.title }}
          DESCRIPTION: ${{ matrix.description }}
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu
          IMAGE="$REGISTRY/$IMAGE_NAME"

          # Avertissement "nightly" uniquement quand c'est le cas
          case "$PRIMARY" in
            nightly*) DESCRIPTION="$DESCRIPTION - Nightly, ne pas utiliser en PROD" ;;
          esac

          # Arguments communs (set -- = tableau d'arguments sûr en sh, gère les espaces)
          set -- \
            --build-arg APP_VERSION="$PRIMARY" \
            --build-arg APP_REVISION="$SHA" \
            --build-arg APP_CREATED="$CREATED"

          # Arguments spécifiques au dashboard
          if [ "$IMAGE_NAME" = "ngx-ops-dashboard" ]; then
            set -- "$@" \
              --build-arg BRANDING_KOFI="$BRANDING_KOFI" \
              --build-arg BRANDING_SITE_LABEL="$BRANDING_SITE_LABEL" \
              --build-arg BRANDING_SITE="$BRANDING_SITE" \
              --build-arg BRANDING_REPO="$BRANDING_REPO" \
              --build-arg BRANDING_DOC="$BRANDING_DOC" \
              --build-arg DASHBOARD_VERSION_URL="$DASHBOARD_VERSION_URL" \
              --build-arg NGINX_VERSION_URL="$NGINX_VERSION_URL" \
              --build-arg SYNC_REF_URL="$SYNC_REF_URL" \
              --build-arg ALERTING_URL="$ALERTING_URL" \
              --build-arg CHANGELOG_URL="$CHANGELOG_URL" \
              --build-arg INTEL_API_URL="$INTEL_API_URL" \
              --build-arg ANALYZER_DEFAULT_IMAGE="$REGISTRY/analyzer-agent-go:$PRIMARY" \
              --build-arg CHALLENGE_DEFAULT_IMAGE="$REGISTRY/ngx-ops-challenge-http:$PRIMARY" \
              --build-arg WAF_DEFAULT_IMAGE="$REGISTRY/analyzer-agent-go:$PRIMARY" \
              --build-arg AGENT_DEFAULT_IMAGE="$REGISTRY/ngx-ops-agent:$PRIMARY"
          fi

          docker build "$@" \
            --label org.opencontainers.image.title="$TITLE" \
            --label org.opencontainers.image.description="$DESCRIPTION" \
            --label org.opencontainers.image.authors="$IMAGE_AUTHOR" \
            --label org.opencontainers.image.version="$PRIMARY" \
            --label org.opencontainers.image.revision="$SHA" \
            --label org.opencontainers.image.created="$CREATED" \
            --label org.opencontainers.image.source="$SOURCE" \
            --pull --no-cache \
            -t "$IMAGE:$PRIMARY" \
            -f "$CTX/Dockerfile" "$CTX"

          for TAG in $TAGS; do
            echo "--- Tag : $TAG ---"
            [ "$TAG" = "$PRIMARY" ] || docker tag "$IMAGE:$PRIMARY" "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done

      - name: Logout
        if: always()
        run: docker logout "$REGISTRY_HOST" || true